# Comments are provided throughout this file to help you get started.
# If you need more help, visit the Docker Compose reference guide at
# https://docs.docker.com/go/compose-spec-reference/

# Here the instructions define your application as a service called "server".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose
services:
  be:
    build:
      # Put local-only overrides (for example TLS_UPGRADE=0 during dev)
      # in an untracked compose.override.yaml file.
      context: callisto
    # Bind-mount local content so the backend can hot-reload scenario/template
    # edits without rebuilding the image during docker-compose development.
    volumes:
      - ./callisto/scenarios:/scenarios:ro
      - ./callisto/ship_templates:/ship_templates:ro
      # Every game played is recorded here, for learning from later.
      - ./game_logs:/game_logs
      # The users file and the remembered sign-ins (sessions.json), kept on
      # this machine, so a rebuilt container does not sign everyone out.
      # Both files are git-ignored.
      - ./callisto/config:/config
    secrets:
      - google_credentials
      - gcs_credentials
      - tls_keys_private
      - tls_keys_public
    command: --tls-keys-private /run/secrets/tls_keys_private --tls-keys-public /run/secrets/tls_keys_public --oauth-creds /run/secrets/google_credentials --scenario-dir gs://callisto-scenarios --users-file /config/authorized_users.json --design-dir /ship_templates --web-server http://localhost:50001
    environment:
      RUST_LOG: debug,gomez=warn
      # Lets the AI service log in, and the backend call it. Local only: on
      # Cloud Run both sides use identity tokens instead. Override the value by
      # exporting CALLISTO_SERVICE_TOKEN before `docker compose up`.
      CALLISTO_SERVICE_TOKEN: ${CALLISTO_SERVICE_TOKEN:-local-dev-service-token}
      CALLISTO_AI_SERVICE: http://ai:8080
      CALLISTO_GAME_LOG_DIR: /game_logs
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcs_credentials
      SENTRY_DSN: https://2bd6b4d950ccb59ce589533dcf1b253a@o4511288095080448.ingest.us.sentry.io/4511288117755904
      SENTRY_ENVIRONMENT: docker-local
    expose:
      - 30000
    ports:
      - 30000:30000
  # The AI service: crews ships switched to AI. Start it with the backend:
  #   docker compose -f compose.yaml -f compose.override.yaml up be ai
  ai:
    build:
      # The repo root, because the service links the backend crate.
      context: .
      dockerfile: ai-ships/Dockerfile
    environment:
      RUST_LOG: info,ai_ships=debug
      CALLISTO_BACKEND: ws://be:30000
      CALLISTO_SERVICE_TOKEN: ${CALLISTO_SERVICE_TOKEN:-local-dev-service-token}
      # Who decides: `admiral:gemini` by default -- Gemini reads the orders
      # given to fleets, squadrons and ships and writes the squadrons'
      # scripts, and the trained network fights them. It calls Gemini only
      # when orders are given or change (under a cent a game), through your
      # application-default credentials (`gcloud auth application-default
      # login` once if the service cannot get a token) and on this project's
      # bill. `CALLISTO_AI_MODEL=network docker-compose up --build -d` plays
      # the network alone, ignoring orders, with no model or credentials;
      # `gemini` has Gemini fly every ship itself; `close` uses a script.
      CALLISTO_AI_MODEL: ${CALLISTO_AI_MODEL:-admiral:gemini}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-callisto-1731280702227}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcs_credentials
      # Every model call, beside the backend's record of the game.
      CALLISTO_GAME_LOG_DIR: /game_logs
    volumes:
      - ./game_logs:/game_logs
    secrets:
      - gcs_credentials
    expose:
      - 8080
    depends_on:
      - be
  fe:
    build:
      context: fe/callisto
      args:
        BACKEND: "http://localhost:30000"
        NODE_SERVER: "http://localhost:50001"
    expose:
      - 3000
    ports:
      - 50001:3000
secrets:
  google_credentials:
    file: callisto/secrets/google_credentials.json
  gcs_credentials:
    file: ~/.config/gcloud/application_default_credentials.json
  tls_keys_private:
    file: callisto/keys/localhost.key
  tls_keys_public:
    file: callisto/keys/localhost.crt


