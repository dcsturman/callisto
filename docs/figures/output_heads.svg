<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <style>
    .box { fill: #eef3f8; stroke: #34506b; stroke-width: 1.2; }
    .out { fill: #e9f4ea; stroke: #3b6e45; }
    .pair { fill: #f6efe2; stroke: #8a6a2f; }
    .lbl { fill: #1d2b38; }
    .small { font-size: 11px; fill: #4a5a68; }
    .arrow { stroke: #34506b; stroke-width: 1.4; fill: none; marker-end: url(#a); }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34506b"/></marker></defs>
  <text x="20" y="24" class="lbl" font-size="15" font-weight="bold">Stage 3: the orders for one own ship i</text>

  <rect x="20" y="70" width="130" height="50" rx="6" class="box"/><text x="85" y="92" text-anchor="middle" class="lbl">ship i</text><text x="85" y="109" text-anchor="middle" class="small">final vector, 128</text>
  <rect x="20" y="185" width="130" height="50" rx="6" class="box"/><text x="85" y="207" text-anchor="middle" class="lbl">enemy j</text><text x="85" y="224" text-anchor="middle" class="small">final vector, 128</text>
  <rect x="20" y="255" width="130" height="50" rx="6" class="box pair"/><text x="85" y="277" text-anchor="middle" class="lbl">pair (i, j)</text><text x="85" y="294" text-anchor="middle" class="small">vector, 64</text>
  <rect x="20" y="335" width="130" height="50" rx="6" class="box"/><text x="85" y="357" text-anchor="middle" class="lbl">friend k</text><text x="85" y="374" text-anchor="middle" class="small">final vector, 128</text>

  <rect x="230" y="55" width="210" height="80" rx="6" class="box"/>
  <text x="335" y="80" text-anchor="middle" class="lbl">linear 128 → 33</text>
  <text x="335" y="98" text-anchor="middle" class="small">verb 5, band 4, posture 3, dodge 3,</text>
  <text x="335" y="113" text-anchor="middle" class="small">assist 2, jump 2, sensor orders 3 + 3,</text>
  <text x="335" y="128" text-anchor="middle" class="small">captain 6, computer 2</text>
  <path d="M150,95 L230,95" class="arrow"/>

  <rect x="230" y="170" width="210" height="110" rx="6" class="box"/>
  <text x="335" y="195" text-anchor="middle" class="lbl">target scorer, for each enemy j</text>
  <text x="335" y="215" text-anchor="middle" class="small">join [i, j, pair] = 320</text>
  <text x="335" y="232" text-anchor="middle" class="small">→ 256 → 4 scores for enemy j:</text>
  <text x="335" y="249" text-anchor="middle" class="small">helm target, fire, lock,</text>
  <text x="335" y="264" text-anchor="middle" class="small">second operator's target</text>
  <path d="M150,105 C 190,140 200,190 230,205" class="arrow"/><path d="M150,210 L230,215" class="arrow"/><path d="M150,280 L230,255" class="arrow"/>

  <rect x="230" y="300" width="210" height="45" rx="6" class="box"/>
  <text x="335" y="320" text-anchor="middle" class="lbl">"none": linear 128 → 3</text>
  <text x="335" y="336" text-anchor="middle" class="small">for fire, lock, second target</text>
  <path d="M150,110 C 180,230 190,300 230,320" class="arrow"/>

  <rect x="230" y="360" width="210" height="55" rx="6" class="box"/>
  <text x="335" y="382" text-anchor="middle" class="lbl">guide score, for each friend k</text>
  <text x="335" y="400" text-anchor="middle" class="small">(W₁ · i) · (W₂ · k) / √128</text>
  <path d="M150,360 L230,380" class="arrow"/>

  <rect x="500" y="150" width="190" height="150" rx="6" class="box out"/>
  <text x="595" y="175" text-anchor="middle" class="lbl">ship i's scores</text>
  <text x="595" y="195" text-anchor="middle" class="small">every choice of every head:</text>
  <text x="595" y="212" text-anchor="middle" class="small">targets are the enemy and</text>
  <text x="595" y="227" text-anchor="middle" class="small">friend rows themselves,</text>
  <text x="595" y="242" text-anchor="middle" class="small">not slots in a list</text>
  <text x="595" y="268" text-anchor="middle" class="small">masked: impossible → −∞</text>
  <text x="595" y="284" text-anchor="middle" class="small">softmax per head</text>
  <path d="M440,95 C 470,95 480,150 500,170" class="arrow"/><path d="M440,225 L500,225" class="arrow"/><path d="M440,322 L500,280" class="arrow"/><path d="M440,385 C 480,385 490,320 500,295" class="arrow"/>

  <rect x="730" y="190" width="155" height="70" rx="6" class="box out"/>
  <text x="807" y="215" text-anchor="middle" class="lbl">ship i's orders</text>
  <text x="807" y="233" text-anchor="middle" class="small">a choice drawn per head</text>
  <text x="807" y="248" text-anchor="middle" class="small">(the best, in play)</text>
  <path d="M690,225 L730,225" class="arrow"/>
</svg>
